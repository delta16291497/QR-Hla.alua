<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>臺灣原住民族第15族-拉阿魯哇族摺頁與主題章牌</title>
  <style>
    :root {
      /* 聖貝位置：以圖片本身為基準，y 越大越往下 */
      --hotspot-x: 95%;
      --hotspot-y: 64%;
      --hotspot-size: 5vmin;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #0b0b0c; color: white; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; }
    .wrap { min-height: 100%; display: grid; place-items: center; padding: 2vmin; }
    .stage { position: relative; width: min(96vw, 1500px); height: min(92dvh, 850px); background: #111; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px #0007; }
    .viewer { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
    .viewer.dragging { cursor: grabbing; }
    .viewer, .image-layer { user-select: none; -webkit-user-select: none; }
    /* 圖片和聖貝同屬 image-layer，因此會同步放大、位移 */
    .image-layer { position: absolute; left: 50%; top: 50%; transform-origin: center center; }
    .art { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; pointer-events: none; }
    .hotspot { position: absolute; left: var(--hotspot-x); top: var(--hotspot-y); transform: translate(-50%, -50%); width: var(--hotspot-size); height: var(--hotspot-size); border: 2px solid rgba(255,255,255,.75); border-radius: 50%; background: rgba(255,255,255,.16); cursor: pointer; padding: 2px; box-shadow: 0 0 0 2px rgba(0,0,0,.15), 0 4px 14px rgba(0,0,0,.35); }
    .hotspot.is-playing { background: rgba(255,255,255,.3); box-shadow: 0 0 0 3px rgba(255,255,255,.35), 0 4px 14px rgba(0,0,0,.35); }
    .hotspot:active { transform: translate(-50%, -50%) scale(.95); }
    .hotspot:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    .hotspotImg, .audio-icon { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
    /* 自訂播放／停止圖示：按鈕本體透明，直接顯示使用者的 icon */
    .hotspot.audio-control, .hotspot.icon-control {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      display: grid;
      place-items: center;
    }
    .hotspot.icon-control.is-playing, .hotspot.audio-control.is-playing {
      filter: brightness(1.02);
    }
    .nav { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: max-content minmax(0,1fr) max-content; align-items: center; gap: 8px; padding: 11px; background: linear-gradient(transparent, #000b); pointer-events: none; }
    .nav > * { pointer-events: auto; }
    .navbtn, .zoombtn { color: white; background: #202020bb; border: 1px solid #ffffff55; border-radius: 10px; padding: 9px 12px; font: 600 14px/1 system-ui, sans-serif; cursor: pointer; }
    .navbtn { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; width: max-content; min-height: 36px; flex-shrink: 0; }
    .navbtn:last-child { justify-self: end; }
    .count { justify-self: center; }
    .count { font-size: 14px; font-weight: 600; }
    .zoom-controls { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; align-items: center; background: #0007; padding: 5px; border-radius: 12px; }
    .zoombtn { min-width: 38px; padding: 9px; }
    .zoom-number { font-size: 12px; min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
    .hint { position: absolute; right: 12px; bottom: 62px; max-width: calc(100% - 24px); padding: 7px 10px; border-radius: 10px; background: #000a; font-size: 13px; pointer-events: none; }
    .stage.debug .hotspot { outline: 2px dashed white; }
    .art, .hotspotImg, .audio-icon { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
    audio { display: none; }
    @media (max-width: 700px) {
      :root { --hotspot-size: 5vmin; }
      .wrap { padding: 0; }
      .stage { width: 100vw; height: 100dvh; border-radius: 0; }
      .navbtn { font-size: 13px; padding: 11px 8px; }
      .hint { bottom: 67px; }
      .zoom-controls { top: max(12px, env(safe-area-inset-top)); }
      .nav { padding-bottom: max(11px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main id="stage" class="stage">
      <div id="viewer" class="viewer" aria-label="圖片閱讀區，可使用 Ctrl 加滾輪或雙指縮放">
        <div id="imageLayer" class="image-layer">
          <img id="art" class="art" alt="展示圖片" draggable="false" />
          <div id="hotspots"></div>
        </div>
      </div>
      <div class="zoom-controls" aria-label="圖片縮放控制">
        <button class="zoombtn" id="zoomOut" type="button" title="縮小">−</button>
        <span class="zoom-number" id="zoomNumber">100%</span>
        <button class="zoombtn" id="zoomIn" type="button" title="放大">+</button>
        <button class="zoombtn" id="zoomReset" type="button" title="還原大小">還原</button>
      </div>
      <div id="hint" class="hint">請點擊聖貝圖以播放音檔</div>
      <nav class="nav" aria-label="圖片切換">
        <button id="prev" class="navbtn" type="button">← 上一張</button>
        <span id="count" class="count">1 / 4</span>
        <button id="next" class="navbtn" type="button">下一張 →</button>
      </nav>
      <audio id="player" preload="metadata"></audio>
    </main>
  </div>
  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    // === 基本設定：未來調整檔名與聖貝位置，可從這裡修改 ===
    const params = new URLSearchParams(location.search);
    const IMAGES = (params.get('img') || 'img001.jpg,img002.jpg,img003.jpg,img004.jpg').split(',').map(s => s.trim()).filter(Boolean);
    const audioFile = params.get('audio') || 'audio.mp3';
    const iconFile = params.get('icon') || 'icon.png';
    const PLAY_ICON = 'play.png';
    const STOP_ICON = 'stop.png';
    // 在這裡調整每張圖片的聖貝位置與音檔（x、y 均為圖片百分比）
    const AUDIO_BUTTONS = {
      img002: [
        { x: 97, y: 25, audio: 'audio.mp3', label: '拉阿魯哇介紹' }
      ],
      img004: [
        { x: 47, y: 5,  audio: 'audio004-1.mp3', label: '聖貝祭' },
        { x: 49, y: 37, audio: 'audio004-2.mp3', label: '十二貝神的祝福語' },
        { x: 92.5, y: 35, audio: 'audio004-3.mp3', label: '祭儀流程' }
      ]
    };
    const version = params.get('ver') || params.get('v') || '';
    const versioned = src => src + (version ? (src.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(version) : '');
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const baseName = src => src.split('/').pop().split('?')[0].replace(/\.[^.]+$/, '').toLowerCase();

    const stage = document.getElementById('stage');
    const viewer = document.getElementById('viewer');
    const layer = document.getElementById('imageLayer');
    const art = document.getElementById('art');
    const hotspots = document.getElementById('hotspots');
    const hint = document.getElementById('hint');
    const audio = document.getElementById('player');
    const count = document.getElementById('count');
    const zoomNumber = document.getElementById('zoomNumber');
    let activeButton = null;
    let selectedFile = '';
    let playbackRequest = 0;

    if (params.has('debug')) stage.classList.add('debug');

    let index = 0, scale = 1, dx = 0, dy = 0, fitScale = 1;
    const MIN_SCALE = 1, MAX_SCALE = 6;
    const pointers = new Map();
    let gesture = null;

    function applyTransform() {
      layer.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${fitScale * scale})`;
      zoomNumber.textContent = Math.round(scale * 100) + '%';
    }
    // 根據圖片原始比例，精準計算它在閱讀區中的顯示尺寸；熱區定位不受黑邊影響。
    function fitImage() {
      if (!art.naturalWidth || !art.naturalHeight) return;
      const w = viewer.clientWidth, h = viewer.clientHeight;
      fitScale = Math.min(w / art.naturalWidth, h / art.naturalHeight);
      // 始終使用圖片的原始像素大小，避免先縮小後再放大造成模糊。
      layer.style.width = art.naturalWidth + 'px';
      layer.style.height = art.naturalHeight + 'px';
      // 每顆聖貝都以螢幕顯示尺寸為基準設定，並隨圖片一起縮放
      const iconSize = getComputedStyle(stage).getPropertyValue('--hotspot-size').trim();
      const vmin = Math.min(innerWidth, innerHeight) / 100;
      const wantedSize = parseFloat(iconSize) * vmin;
      hotspots.querySelectorAll('.hotspot').forEach(button => {
        button.style.width = wantedSize / fitScale + 'px';
        button.style.height = wantedSize / fitScale + 'px';
      });
      applyTransform();
    }
    function resetZoom() { scale = 1; dx = 0; dy = 0; applyTransform(); }
    function zoomTo(newScale, cx, cy) {
      const old = scale;
      scale = clamp(newScale, MIN_SCALE, MAX_SCALE);
      const ratio = scale / old;
      const rect = viewer.getBoundingClientRect();
      const px = cx - rect.left - rect.width / 2;
      const py = cy - rect.top - rect.height / 2;
      dx = px - (px - dx) * ratio;
      dy = py - (py - dy) * ratio;
      if (scale === 1) { dx = 0; dy = 0; }
      applyTransform();
    }
    function zoomCenter(factor) {
      const r = viewer.getBoundingClientRect();
      zoomTo(scale * factor, r.left + r.width / 2, r.top + r.height / 2);
    }
    document.getElementById('zoomIn').addEventListener('click', () => zoomCenter(1.25));
    document.getElementById('zoomOut').addEventListener('click', () => zoomCenter(0.8));
    document.getElementById('zoomReset').addEventListener('click', resetZoom);

    // 電腦：Ctrl + 滑鼠滾輪可針對游標所在位置縮放；一般滾輪不攔截。
    viewer.addEventListener('wheel', e => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      zoomTo(scale * Math.exp(-e.deltaY * 0.008), e.clientX, e.clientY);
    }, {passive:false});

    // 拖曳與手勢：滑鼠按住拖動；手機單指平移、雙指縮放。
    // pointer capture 可以在游標離開圖片時繼續移動，直到鬆開滑鼠。
    function midpointAndDistance() {
      const [a, b] = [...pointers.values()];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
        dist: Math.hypot(a.x - b.x, a.y - b.y) };
    }
    viewer.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      viewer.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if (pointers.size === 1) gesture = {x:e.clientX, y:e.clientY, dx, dy};
      else if (pointers.size === 2) gesture = {pinch:midpointAndDistance()};
      viewer.classList.add('dragging');
    });
    viewer.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      e.preventDefault();
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if (pointers.size >= 2) {
        const now = midpointAndDistance();
        if (gesture?.pinch?.dist > 0) {
          const last = gesture.pinch;
          // 先把雙指中心的平移量加進位移，再以中心點縮放
          dx += now.x - last.x;
          dy += now.y - last.y;
          zoomTo(scale * (now.dist / last.dist), now.x, now.y);
        }
        gesture = {pinch:now};
      } else if (gesture && !gesture.pinch && scale > 1) {
        dx = gesture.dx + e.clientX - gesture.x;
        dy = gesture.dy + e.clientY - gesture.y;
        applyTransform();
      }
    });
    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (viewer.hasPointerCapture(e.pointerId)) viewer.releasePointerCapture(e.pointerId);
      if (pointers.size === 1) {
        const p = [...pointers.values()][0];
        gesture = {x:p.x, y:p.y, dx, dy};
      } else if (pointers.size === 0) {
        gesture = null;
        viewer.classList.remove('dragging');
      }
    }
    viewer.addEventListener('pointerup', endPointer);
    viewer.addEventListener('pointercancel', endPointer);
    viewer.addEventListener('lostpointercapture', e => {
      if (pointers.has(e.pointerId)) endPointer(e);
    });

    function updateUI() {
      const playing = !audio.paused && !audio.ended;
      const isFourth = baseName(IMAGES[index]) === 'img004';
      hint.textContent = playing
        ? (isFourth ? '音檔播放中，再次點擊可停止' : '音檔播放中，再次點擊可停止')
        : '請點擊圖示以播放音檔';
      hotspots.querySelectorAll('.hotspot').forEach(btn => {
        const on = btn === activeButton && playing;
        btn.classList.toggle('is-playing', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        const icon = btn.querySelector('.audio-icon, .hotspotImg');
        if (icon) {
          icon.src = on ? STOP_ICON : PLAY_ICON;
          icon.alt = on ? '停止' : '播放';
        }
      });
    }
    function renderButtons(page) {
      hotspots.replaceChildren();
      activeButton = null;
      const buttons = AUDIO_BUTTONS[page] || [];
      hint.hidden = !buttons.length;
      hint.style.display = buttons.length ? 'block' : 'none';
      buttons.forEach((entry, i) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'hotspot';
        button.style.left = entry.x + '%';
        button.style.top = entry.y + '%';
        button.setAttribute('aria-label', '播放或停止：' + entry.label);
        button.title = '播放／停止：' + entry.label;
        button.classList.add('icon-control');
        const icon = document.createElement('img');
        icon.className = 'audio-icon';
        icon.alt = '播放';
        icon.draggable = false;
        icon.src = PLAY_ICON;
        button.appendChild(icon);
        button.addEventListener('click', async () => {
          try {
            if (activeButton === button && !audio.paused) {
              audio.pause();
              audio.currentTime = 0;
              activeButton = null;
              updateUI();
              return;
            }
            const request = ++playbackRequest;
            audio.pause();
            // 切換不同段落時，從該錄音的開頭播放
            const requested = versioned(entry.audio);
            if (selectedFile !== requested) {
              selectedFile = requested;
              audio.src = requested;
              audio.load();
            } else { audio.currentTime = 0; }
            activeButton = button;
            await audio.play();
            if (request !== playbackRequest) audio.pause();
            updateUI();
          } catch(err) {
            if (err.name !== 'AbortError') alert('無法播放音檔：' + entry.audio + '\n' + err.message);
          }
        });
        hotspots.appendChild(button);
      });
      fitImage();
    }
    function show(i) {
      if (!IMAGES.length) return;
      index = (i + IMAGES.length) % IMAGES.length;
      audio.pause();
      playbackRequest++;
      activeButton = null;
      art.src = versioned(IMAGES[index]);
      count.textContent = `${index + 1} / ${IMAGES.length}`;
      renderButtons(baseName(IMAGES[index]));
      updateUI();
      resetZoom();
      pointers.clear(); gesture = null;
    }
    art.addEventListener('load', fitImage);
    art.addEventListener('error', () => {
      if (art.getAttribute('src') === versioned(IMAGES[index])) {
        hint.textContent = '找不到圖片：' + IMAGES[index];
        hint.style.display = 'block';
      }
    });
    window.addEventListener('resize', fitImage);
    document.getElementById('prev').addEventListener('click', () => show(index - 1));
    document.getElementById('next').addEventListener('click', () => show(index + 1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') show(index - 1);
      if (e.key === 'ArrowRight') show(index + 1);
      if (e.key === 'Escape') resetZoom();
    });
    ['play', 'pause', 'ended'].forEach(event => audio.addEventListener(event, updateUI));
    IMAGES.forEach(src => { const img = new Image(); img.src = versioned(src); });
    show(0);
  </script>
</body>
</html>
